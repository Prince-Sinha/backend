spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      routes:
        # Auth Routes (User Service)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/user-service
        
        # User Service Routes
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/user-service
        
        # Post Service Routes
        - id: post-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - name: CircuitBreaker
              args:
                name: postService
                fallbackUri: forward:/fallback/post-service
        
        # Opinion Service Routes
        - id: opinion-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/opinions/**
          filters:
            - name: CircuitBreaker
              args:
                name: opinionService
                fallbackUri: forward:/fallback/opinion-service
        
        # WebSocket Route for Opinion Service
        - id: opinion-websocket
          uri: ws://localhost:8083
          predicates:
            - Path=/ws/**
      
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      postService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
      opinionService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
